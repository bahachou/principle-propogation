_schema-version: "3.2"
ID: standalone
version: 0.0.1
parameters:
  deploy_mode: standalone-approuter
  appname: standalone-approuter
  subdomain: 0ce0c515trial
modules:
  - name: standalone-approuter
    type: approuter.nodejs
    path: standalone-approuter
    requires:
      - name: standalone_html_repo_runtime
      - name: uaa_standalone
      - name: standalone_connectivity
      - name: standalone-destination-service
      - name: standalone_saas-registry
        group: destinations
        properties:
          forwardAuthToken: false
          name: ui5
          url: https://ui5.sap.com
    properties:
      TENANT_HOST_PATTERN: "^(.*)-${appname}.${default-domain}"
    parameters:
      disk-quota: 256M
      memory: 256M
      routes:
        - route: https://${subdomain}-${appname}.${default-domain}
        - route: https://princpl-9laylcse-${appname}.${default-domain}
        - route: https://cons-y43ibyop-${appname}.${default-domain}

  - name: standalone_ui_deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: standalone_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - uiapp.zip
          name: uiapp
          target-path: resources/

  - name: uiapp
    type: html5
    path: uiapp
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:
  - name: standalone_html_repo_runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: uaa_standalone
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-name: standalone-xsuaa-service
      service-plan: application

  - name: standalone_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: standalone_connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-name: standalone-connectivity-service
      service-plan: lite

  - name: standalone_saas-registry
    type: org.cloudfoundry.managed-service
    parameters:
      service: saas-registry
      service-name: ${appname}-saas-registry
      service-plan: application
      config:
        xsappname: standalone
        appName: standalone-approuter
        displayName: Users
        description: Users
        category: Custom Apps
        appUrls:
          onSubscription: https://${subdomain}-${appname}.${default-domain}/callback/v1.0/tenants/{tenantId}
          getDependencies: https://${subdomain}-${appname}.${default-domain}/callback/v1.0/dependencies

  - name: standalone-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: standalone-destination-service
      service-plan: lite